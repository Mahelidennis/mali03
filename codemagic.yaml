workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK (debug)
        script: flutter build apk --debug --no-sound-null-safety
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
